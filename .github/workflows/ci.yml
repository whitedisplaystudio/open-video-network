name: CI

# The repository is public, so runner minutes are not metered. Minutes are
# not the only cost, though: a macOS arm64 runner can sit in a queue for a
# while, and a run nobody reads is still noise. So the platform spread is
# matched to how much each case tells you.
#
#   every push and pull request   Linux — fast, and catches nearly everything
#   pushes to main                all three — where platform differences bite
#   run by hand                   whatever you pick
#
# Everything the tests need is in the repository; there are no secrets, so a
# pull request from a fork runs the same as a branch here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to test
        type: choice
        default: linux
        options:
          - linux
          - all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup component add rustfmt clippy

      # 459 crates take a while from cold. The cache is what keeps a run
      # to a few minutes rather than fifteen.
      - uses: Swatinem/rust-cache@v2

      # Optional at runtime, but with it installed the thumbnail tests
      # actually exercise FFmpeg rather than skipping.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace -- --test-threads=2

  other-platforms:
    name: ${{ matrix.os }}
    # On main because that is the branch a release is cut from, and on
    # request. Not on every pull request: Linux has already said whether the
    # code works, and these two are slow to start.
    if: >-
      inputs.platforms == 'all' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace -- --test-threads=2
