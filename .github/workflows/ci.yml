name: CI

# Runner minutes are metered while this repository is private, and the
# multipliers are not equal: Linux counts 1x, Windows 2x and macOS 10x. So
# Linux runs on every push, and the expensive platforms run weekly, on
# demand, and before a release — often enough to catch a break, rarely
# enough to stay inside the free allowance.
#
# Making the repository public removes the metering entirely.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monday morning, UTC.
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: rustup component add rustfmt clippy

      # 459 crates take a while from cold. The cache is what keeps a run
      # to a few minutes rather than fifteen.
      - uses: Swatinem/rust-cache@v2

      # Optional at runtime, but with it installed the thumbnail tests
      # actually exercise FFmpeg rather than skipping.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace -- --test-threads=2

  other-platforms:
    name: ${{ matrix.os }}
    # Everything below this line is charged at a multiple, so it is not on
    # the every-push path.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace -- --test-threads=2
