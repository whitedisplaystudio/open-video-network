name: CI

# Runs only when asked: from the Actions tab, or `gh workflow run ci.yml`.
#
# Runner minutes are metered while this repository is private, and the
# multipliers are not equal — Linux counts 1x, Windows 2x and macOS 10x — so
# nothing here starts on its own. Run it before tagging a release, and after
# anything that touches platform-specific code.
#
# To go back to running on every push, add a `push:` trigger below. Making
# the repository public removes the metering entirely.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to test
        type: choice
        default: linux
        options:
          - linux
          - all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup component add rustfmt clippy

      # 459 crates take a while from cold. The cache is what keeps a run
      # to a few minutes rather than fifteen.
      - uses: Swatinem/rust-cache@v2

      # Optional at runtime, but with it installed the thumbnail tests
      # actually exercise FFmpeg rather than skipping.
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Formatting
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace -- --test-threads=2

  other-platforms:
    name: ${{ matrix.os }}
    if: inputs.platforms == 'all'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Tests
        run: cargo test --workspace -- --test-threads=2
