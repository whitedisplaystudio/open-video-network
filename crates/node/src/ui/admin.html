<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app.admin.title">ourvideo — node</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="data:,">
</head>
<body>

<a class="skip-link" href="#main" data-i18n="a11y.skipToContent">Skip to content</a>

<header class="topbar">
  <a class="brand" href="#/overview"><span class="brand-mark" aria-hidden="true">◆</span>
    <span data-i18n="brand.admin">ourvideo node</span></a>

  <nav class="nav" data-i18n-label="nav.admin.label">
    <button type="button" data-page="overview" data-i18n="nav.overview">Overview</button>
    <button type="button" data-page="peers" data-i18n="nav.peers">Peers</button>
    <button type="button" data-page="content" data-i18n="nav.content">Content</button>
    <button type="button" data-page="moderation" data-i18n="nav.moderation">Moderation</button>
    <button type="button" data-page="privacy" data-i18n="nav.privacy">Privacy</button>
  </nav>

  <span class="spacer"></span>

  <label class="sr-only" for="language" data-i18n="language.label">Language</label>
  <select id="language" class="lang-select"></select>

  <span class="badge" id="connection" data-i18n-title="conn.title" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="connection-text">…</span></span>
  <a class="badge" href="/ui" data-i18n="nav.toViewer">Watch</a>
</header>

<main id="main" tabindex="-1">
  <!-- Overview -->
  <section class="page" data-page="overview">
    <div class="page-head"><h1 data-i18n="admin.overview.title">Overview</h1></div>
    <p class="lede" data-i18n="admin.overview.lede"></p>

    <div class="stats" id="stats"></div>

    <div class="cols-2">
      <div class="card">
        <h2 data-i18n="admin.identity.title"></h2>
        <dl class="kv" id="identity"></dl>
      </div>

      <div class="card">
        <h2 data-i18n="admin.invite.title"></h2>
        <p class="lede" data-i18n="admin.invite.lede"></p>
        <div class="field">
          <label for="share-link" data-i18n="admin.invite.field"></label>
          <input id="share-link" type="text" readonly>
        </div>
        <div class="row">
          <button type="button" id="copy-link" class="primary" data-i18n="admin.invite.copy"></button>
          <span class="badge" id="copy-state"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="admin.transfers.title"></h2>
      <div id="transfers"></div>
    </div>

    <div class="card">
      <h2 data-i18n="admin.activity.title"></h2>
      <div class="log" id="log"></div>
    </div>

    <div class="card">
      <h2 data-i18n="admin.shutdown.title"></h2>
      <p class="lede" data-i18n="admin.shutdown.lede"></p>
      <button type="button" id="shutdown" class="danger" data-i18n="admin.shutdown.button"></button>
    </div>
  
    <div class="card">
      <h2 data-i18n="admin.channel.title"></h2>
      <p class="hint" data-i18n="admin.channel.lede"></p>
      <div class="row">
        <input id="channel-link" type="text" readonly>
        <button type="button" id="copy-channel-link" class="small"
                data-i18n="admin.channel.copy"></button>
      </div>
    </div>
</section>

  <!-- Peers -->
  <section class="page" data-page="peers" hidden>
    <div class="page-head"><h1 data-i18n="admin.peers.title">Peers</h1><span class="badge" id="peer-count"></span></div>
    <p class="lede" data-i18n="admin.peers.lede"></p>

    <div class="card">
      <h2 data-i18n="admin.peers.join.title"></h2>
      <div class="field">
        <label for="peer-target" data-i18n="admin.peers.join.label"></label>
        <input id="peer-target" type="text" placeholder="https://video.example.jp" autocomplete="off">
      </div>
      <button type="button" id="peer-add" class="primary" data-i18n="admin.peers.join.button"></button>
    </div>

    <div class="card">
      <h2 data-i18n="admin.peers.list.title"></h2>
      <div id="peers"></div>
    </div>
  </section>

  <!-- Content -->
  <section class="page" data-page="content" hidden>
    <div class="page-head"><h1 data-i18n="admin.content.title">Content</h1></div>
    <p class="lede" data-i18n="admin.content.lede"></p>

    <div class="card">
      <h2 data-i18n="admin.publish.title"></h2>
      <p class="hint" data-i18n="admin.publish.lede"></p>
      <div class="field">
        <label for="upload-file" data-i18n="admin.publish.file"></label>
        <input id="upload-file" type="file" accept="video/*,audio/*">
      </div>
      <div class="field">
        <label for="upload-source" data-i18n="admin.publish.sourceUrl"></label>
        <input id="upload-source" type="url" inputmode="url"
               data-i18n-placeholder="admin.publish.sourceUrlPlaceholder">
        <p class="hint" data-i18n="admin.publish.sourceUrlHint"></p>
      </div>
      <div class="field">
        <label for="upload-title" data-i18n="admin.publish.titleField"></label>
        <input id="upload-title" type="text" data-i18n-placeholder="admin.publish.titlePlaceholder">
      </div>
      <div class="field">
        <label for="upload-description" data-i18n="admin.publish.description"></label>
        <textarea id="upload-description"></textarea>
      </div>
      <div class="field">
        <label for="upload-tags" data-i18n="admin.publish.tags"></label>
        <input id="upload-tags" type="text" data-i18n-placeholder="admin.publish.tagsPlaceholder">
      </div>
      <div class="row">
        <button type="button" id="upload-go" class="primary" data-i18n="admin.publish.button"></button>
        <span class="badge" id="upload-state"></span>
      </div>
      <div class="meter" id="upload-meter"><i></i></div>
    </div>

    <div class="card">
      <h2 data-i18n="admin.storage.title"></h2>
      <dl class="kv" id="storage"></dl>
      <div class="meter" id="cache-meter"><i></i></div>
    </div>

    <div class="card">
      <h2 data-i18n="admin.local.title"></h2>
      <div id="local-videos"></div>
    </div>

    <div class="card">
      <h2 data-i18n="admin.profile.title"></h2>
      <div class="field">
        <label for="profile-name" data-i18n="admin.profile.name"></label>
        <input id="profile-name" type="text">
      </div>
      <div class="field">
        <label for="profile-bio" data-i18n="admin.profile.bio"></label>
        <textarea id="profile-bio"></textarea>
      </div>
      <button type="button" id="profile-save" class="primary" data-i18n="admin.profile.save"></button>
    </div>
  </section>

  <!-- Moderation -->
  <section class="page" data-page="moderation" hidden>
    <div class="page-head"><h1 data-i18n="admin.moderation.title">Moderation</h1></div>
    <p class="lede" data-i18n="admin.moderation.lede"></p>

    <div class="cols-2">
      <div class="card">
        <h2 data-i18n="admin.moderation.videos"></h2>
        <div class="field">
          <label for="block-cid" data-i18n="admin.moderation.cidLabel"></label>
          <input id="block-cid" type="text" placeholder="bafy…" autocomplete="off">
        </div>
        <button type="button" id="block-cid-go" data-i18n="admin.moderation.block"></button>
        <div id="blocked-cids"></div>
      </div>

      <div class="card">
        <h2 data-i18n="admin.moderation.creators"></h2>
        <div class="field">
          <label for="block-creator" data-i18n="admin.moderation.keyLabel"></label>
          <input id="block-creator" type="text" placeholder="hex" autocomplete="off">
        </div>
        <button type="button" id="block-creator-go" data-i18n="admin.moderation.block"></button>
        <div id="blocked-creators"></div>
      </div>
    </div>
  </section>

  <!-- Privacy -->
  <section class="page" data-page="privacy" hidden>
    <div class="page-head"><h1 data-i18n="admin.privacy.title">Your data</h1></div>
    <p class="lede" data-i18n="admin.privacy.lede"></p>

    <div class="cols-2">
      <div class="card">
        <h2 data-i18n="admin.privacy.model"></h2>
        <p class="lede" data-i18n="admin.privacy.modelLede"></p>
        <div id="preferences"></div>
      </div>

      <div class="card">
        <h2 data-i18n="admin.privacy.history"></h2>
        <div id="watch-summary"></div>
        <div id="watch-history"></div>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="admin.privacy.erase.title"></h2>
      <p class="lede" data-i18n="admin.privacy.erase.lede"></p>
      <button type="button" id="clear-history" class="danger" data-i18n="admin.privacy.erase.button"></button>
    </div>
  </section>
</main>

<footer class="footer">
  <span data-i18n="footer.licence"></span>
  <a id="source-link" href="" rel="license noopener" data-i18n="footer.source"></a>
  <span class="footer-sep" aria-hidden="true">·</span>
  <span id="build-version"></span>
</footer>

<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/assets/admin.js"></script>
</body>
</html>
